<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Web Design Final Project</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main class="container">
      <figure>
        <img
          src="images/img1.jpg"
          alt="A scenic mountain landscape during sunset"
        />
        <figcaption>Mountain View</figcaption>
        <p>
          Exploring the majestic peaks during the golden hour provides a
          breathtaking experience of nature's tranquil beauty.
        </p>
      </figure>

      <figure>
        <img
          src="images/img2.jpg"
          alt="A freshly brewed cup of artisanal coffee on a wooden table"
        />
        <figcaption>Coffee Time</figcaption>
        <p>
          A warm cup of hand-crafted coffee is the perfect companion for a quiet
          morning filled with focus and creativity.
        </p>
      </figure>

      <figure>
        <img
          src="images/img3.jpg"
          alt="A vibrant green forest with sunlight filtering through tall trees"
        />
        <figcaption>Forest Canopy</figcaption>
        <p>
          Walking through the dense woodland allows you to disconnect from urban
          noise and reconnect with the peaceful outdoors.
        </p>
      </figure>

      <figure>
        <img
          src="images/img4.jpg"
          alt="A modern workspace setup with a laptop, notebook, and coding environment"
        />
        <figcaption>Workspace Setup</figcaption>
        <p>
          An organized and minimalist desk environment boosts daily productivity
          and inspires innovative software engineering ideas.
        </p>
      </figure>
    </main>
  </body>
</html>
